{% extends "base.html" %}

{% block title %}Sign in - Dairy Farm Login{% endblock %}

{% block content %}
<div class="w-full max-w-md mx-auto my-auto p-4">
  <div class="glass-card p-8 shadow-2xl border-2 border-[#1B5E20]/20 bg-white/95">
    
    <!-- لوگو اور عنوان -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto mb-3 bg-[#1B5E20] text-white rounded-2xl flex items-center justify-center text-4xl shadow-lg border-4 border-[#FFF8E1]">
        🥛
      </div>
      <h2 class="text-2xl font-bold text-[#1B5E20] urdu-font">Dairy Farm Management System</h2>
      <p class="text-xs text-gray-500 font-medium tracking-wide mt-1">DAIRY FARM ERP PAKISTAN</p>
      <div class="mt-3 inline-block px-3 py-1 bg-[#FFF8E1] border border-[#ffe082] rounded-full text-xs text-[#5d4037] font-semibold">
        🔒 Secure admin portal
      </div>
    </div>

    <!-- لاگ ان فارم -->
    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-semibold text-gray-700 mb-1.5 urdu-font">
          Username:
        </label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          required 
          class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#1B5E20] focus:border-[#1B5E20] outline-none text-left font-medium transition"
          placeholder="Enter your username"
        >
      </div>

      <div>
        <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5 urdu-font">
          Password:
        </label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#1B5E20] focus:border-[#1B5E20] outline-none text-left font-medium transition"
          placeholder="Enter your password"
        >
      </div>

      <div class="pt-2">
        <button 
          type="submit" 
          class="w-full py-3 bg-[#1B5E20] hover:bg-[#2e7d32] text-white font-bold rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2 urdu-font text-base"
        >
          <span>🔓</span>
          <span>Log in to dashboard</span>
        </button>
      </div>
    </form>

    <div class="mt-6 pt-4 border-t border-gray-100 text-center text-xs text-gray-400">
      Python Flask and a single-file SQLite database
    </div>

  </div>
</div>
{% endblock %}
