services:
  - type: web
    name: professor-dairy-form
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/farm.db
      - key: LOAD_DEMO_DATA
        value: "false"
    disk:
      name: dairy-farm-data
      mountPath: /var/data
      sizeGB: 1
